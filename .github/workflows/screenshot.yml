# 本番ページのスマホ画面（iPhone 13）を撮る（手動で実行・確認用）。撮った画像は Artifacts に残る。何も変更しない。
name: screenshot
on:
  workflow_dispatch:
    inputs:
      paths:
        description: '撮るページ（スペース区切り。例：/ /events/xxx）'
        default: '/'
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          mkdir s && cd s && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Take screenshots
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          cd s
          cat > shot.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await (await b.newContext({ ...devices['iPhone 13'] })).newPage();
            let i = 0;
            for (const path of process.env.PATHS.split(/\s+/).filter(Boolean)) {
              await p.goto('https://www.evenow.jp' + path, { waitUntil: 'networkidle', timeout: 60000 });
              await p.waitForTimeout(1500);
              await p.screenshot({ path: `shot-${++i}-top.png` });
              await p.screenshot({ path: `shot-${i}-top.jpg`, type: 'jpeg', quality: 55 });
              await p.screenshot({ path: `shot-${i}-full.png`, fullPage: true });
              console.log(i, path, await p.title());
              for (const t of await p.locator('.topic-card').allInnerTexts()) console.log('CARD', t.replace(/\s+/g, ' ').slice(0, 400));
            }
            await b.close();
          })();
          JS
          node shot.js
      - name: Print top screenshots (base64, for environments that cannot download artifacts)
        run: cd s && for f in shot-*-top.jpg; do echo "BEGIN $f"; base64 -w0 "$f"; echo; echo "END $f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: s/shot-*.png
          retention-days: 3
