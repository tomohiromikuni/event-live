# イベント情報の自動収集（毎日1回）。EVENOW の /api/cron/collect を、処理が終わるまで（最大10回）呼ぶ。
# リポジトリの Settings → Secrets and variables → Actions に CRON_SECRET（Vercel と同じ値）を登録して使う。
name: collect-events
on:
  schedule:
    - cron: '17 19 * * *'   # 毎日 4:17（日本時間）
  workflow_dispatch: {}      # 手動実行もできる
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run collector until done
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://www.evenow.jp
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET が未設定です"; exit 0; fi
          for i in $(seq 1 10); do
            res=$(curl -sS -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 90 "$SITE/api/cron/collect" || echo '{}')
            echo "run $i: $res"
            echo "$res" | grep -q '"done":true' && break
            sleep 5
          done
      - name: Create venue maps for events without one
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://www.evenow.jp
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          for i in $(seq 1 5); do
            res=$(curl -sS -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 90 "$SITE/api/cron/automap" || echo '{}')
            echo "automap $i: $res"
            echo "$res" | grep -q '"done":true' && break
            sleep 5
          done
