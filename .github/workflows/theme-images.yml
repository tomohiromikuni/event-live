# テーマ画像の候補を Wikimedia Commons（商用OKのライセンスだけ）から探し、横長（1200x480）に縮めて theme-candidates ブランチに置く（手動で実行）。
# 選んだものだけを本体の public/themes に入れ、必要なクレジット（作者・ライセンス）を表示する。
name: theme-images
on:
  workflow_dispatch:
    inputs:
      list:
        description: '「テーマ=検索語」を | 区切り'
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize
        env:
          LIST: ${{ inputs.list }}
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null
          mkdir -p out && cd out
          IFS='|' read -ra ARGS <<< "$LIST"
          python3 -I ../scripts/themes/fetch_commons.py "${ARGS[@]}"
          for f in *.jpg; do convert "$f" -auto-orient -resize '1200x480^' -gravity center -extent 1200x480 -strip -quality 72 "$f"; done
          # 決めた写真（名前に _番号 が無いもの）は、軽い WebP も作る
          for f in *.jpg; do case "$f" in *_[0-9].jpg) ;; *) convert "$f" -quality 68 "${f%.jpg}.webp" && echo "webp ${f%.jpg} $(stat -c%s ${f%.jpg}.webp)";; esac; done
          montage -label '%t' *.jpg -tile 4x -geometry 360x144+6+6 -pointsize 16 sheet.png && convert sheet.png -quality 80 sheet.jpg && rm sheet.png
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b theme-candidates && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm 'テーマ画像の候補' && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" theme-candidates && echo published
