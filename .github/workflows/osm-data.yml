# 日本全国の OpenStreetMap から、トイレ・駐車場だけを抜き出して osm-data ブランチに置く（月1回・無料）。
# イベナウはここから会場の周りの分だけを読む（混雑しがちな公開の Overpass サーバーに頼らないため）。
# データ © OpenStreetMap contributors（ODbL）。出典は osm-data ブランチの README と、各ページの地図に表示する。
name: osm-data
on:
  schedule:
    - cron: '23 18 3 * *'   # 毎月3日 3:23（日本時間）
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download Japan extract (Geofabrik)
        run: curl -sSfL -A 'EVENOW-osm-data/1.0 (+https://www.evenow.jp/about)' -o japan.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf && ls -lh japan.osm.pbf
      - name: Extract toilets and parking
        run: |
          osmium tags-filter japan.osm.pbf nwr/amenity=toilets,parking -o f.osm.pbf --overwrite
          # 会場になりやすい場所の外形（会場の範囲を薄く囲うため）
          osmium tags-filter japan.osm.pbf wr/leisure=park,garden,stadium,common,recreation_ground,sports_centre wr/place=square wr/landuse=recreation_ground wr/tourism=theme_park,zoo wr/amenity=events_venue,exhibition_centre -o v.osm.pbf --overwrite
          rm japan.osm.pbf
          osmium export v.osm.pbf -f geojsonseq --geometry-types=polygon -a type,id -o v.geojsonseq --overwrite
          ls -lh v.osm.pbf v.geojsonseq
          osmium export f.osm.pbf -f geojsonseq --geometry-types=point,polygon -a type,id -o f.geojsonseq --overwrite
          ls -lh f.osm.pbf f.geojsonseq
      - name: Build tiles
        run: |
          python3 -I scripts/osm/build_tiles.py out < f.geojsonseq
          python3 -I scripts/osm/build_areas.py out < v.geojsonseq
          du -sh out; ls out/t | wc -l
      - name: Publish to osm-data branch
        run: |
          cd out
          cat > README.md <<'MD'
          # EVENOW 用 OpenStreetMap 抽出データ（トイレ・駐車場）
          日本全国の OpenStreetMap から amenity=toilets / amenity=parking（t/）と、公園・広場などの外形（a/）を抜き出し、0.1度ごとに分けたもの。月1回自動で作り直す。
          データ © OpenStreetMap contributors。ライセンスは ODbL 1.0（https://opendatacommons.org/licenses/odbl/）。
          MD
          sed -i 's/^          //' README.md
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b osm-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "OpenStreetMap 抽出データ $(date +%Y-%m-%d)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" osm-data
          echo published
