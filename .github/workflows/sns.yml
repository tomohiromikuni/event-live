# SNS（X）の下書き作成・自動投稿（15分ごと）。EVENOW の /api/cron/sns を呼ぶ。
# 管理画面「X投稿」で自動投稿をONにしない限り、下書きを作るだけ（投稿はしない）。
# リポジトリの Settings → Secrets and variables → Actions に CRON_SECRET（Vercel と同じ値）を登録して使う。
name: sns-posts
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
jobs:
  sns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create drafts / auto-post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://www.evenow.jp
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET が未設定です"; exit 0; fi
          curl -sS -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 90 "$SITE/api/cron/sns"; echo
