# OpenStreetMap（無料の公開サーバー）につながらなかったイベントの会場マップを、1時間ごとに取り直す。
# AI もイベント探し（自動収集）も使わない（費用0円）。対象が無ければすぐ終わる。
name: osm-retry
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch: {}
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check OpenStreetMap servers (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          q='data=[out:json][timeout:20];nwr(around:700,40.6128,141.2058)[amenity~"^(toilets|parking)$"];out center tags;'
          for u in https://overpass-api.de/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            rm -f /tmp/r.json
            curl -s -m 40 -A 'EVENOW-bot/1.0 (+https://www.evenow.jp/about)' -o /tmp/r.json -w "$u %{http_code} %{time_total}s " --data-urlencode "$q" "$u" || true
            head -c 120 /tmp/r.json 2>/dev/null | tr '\n' ' '; echo
          done
      - name: Retry OpenStreetMap import
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://www.evenow.jp
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          for i in 1 2 3; do
            res=$(curl -sS -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 90 "$SITE/api/cron/osm-retry" || echo '{}')
            echo "osm-retry $i: $res"
            echo "$res" | grep -q '"done":true' && break
            sleep 5
          done
      - name: Translate events for the English site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://www.evenow.jp
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          for i in 1 2 3 4; do
            res=$(curl -sS -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 90 "$SITE/api/cron/translate" || echo '{}')
            echo "translate $i: $res"
            echo "$res" | grep -q '"done":true' && break
            sleep 3
          done
          # 新しく公開・更新したイベントを検索エンジン（IndexNow）に知らせる（鍵が未設定なら何もしない）
          echo "indexnow: $(curl -sS -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 30 "$SITE/api/cron/indexnow" || echo '{}')"
